<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Send order — Baqala Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#1F4D3A; --green-dark:#153529; --marigold:#E2A33D;
    --bg:#F6F7F3; --card:#FFFFFF; --ink:#22281F; --ink-soft:#5C6459;
    --line:#E4E7DF; --red:#B3452E; --green-soft:#EAF3EC; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,.num{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:440px;margin:0 auto;min-height:100vh;padding:24px 18px 40px;}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Space Grotesk';}
  .brand h1{font-size:17px;margin:0;}
  .brand p{font-size:12px;color:var(--ink-soft);margin:0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin:0 0 6px;}
  input[type=text],input[type=number],select{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;font-family:'Inter';background:var(--card);color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--green);outline-offset:-1px;}
  .btn{border:none;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:'Inter';}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:disabled{background:#B9C2B4;}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .err{color:var(--red);font-size:13px;margin-top:8px;display:none;}
  .hide{display:none !important;}

  .shop-banner{display:flex;align-items:center;gap:10px;background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:18px;}
  .shop-banner .icon{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-family:'Space Grotesk';}
  .shop-banner .name{font-weight:600;font-size:15px;margin:0;}
  .shop-banner .sub{font-size:12px;color:var(--ink-soft);margin:0;}

  .item-row{
    background:linear-gradient(135deg, #fff 60%, var(--green-soft) 100%);
    border:1.5px solid var(--green);border-left:5px solid var(--green);
    border-radius:11px;padding:9px 10px;margin-top:9px;
    display:flex;gap:8px;align-items:center;
  }
  .item-row .row-icon{font-size:16px;flex-shrink:0;align-self:flex-start;margin-top:9px;}
  .item-row .row-selects{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .item-row .row-selects select{background:#fff;}
  .item-row .i-qty{width:60px;flex:0 0 60px;background:#fff;text-align:center;align-self:flex-start;}
  .item-row .rm{background:none;border:none;color:var(--red);font-size:15px;font-weight:700;cursor:pointer;padding:2px 4px;flex-shrink:0;align-self:flex-start;}
  .add-item-btn{width:100%;margin-top:10px;border:1.5px dashed var(--marigold);background:var(--card);border-radius:10px;padding:11px;color:#8a6417;font-weight:700;font-size:13.5px;cursor:pointer;}

  .success{text-align:center;padding:40px 10px;}
  .success .big{font-size:44px;display:block;margin-bottom:10px;}
  .success h2{margin:0 0 6px;}
  .success p{color:var(--ink-soft);font-size:14px;margin:0 0 24px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:30px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);}

  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Inter';}
  .tabs button.active{background:var(--green);color:#fff;border-color:var(--green);}

  .order-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .order-card .top-row{display:flex;justify-content:space-between;align-items:center;}
  .order-card .date{font-size:13px;font-weight:700;margin:0;}
  .order-card .items-count{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  .order-card .amt{font-size:15px;font-weight:700;margin:0;}
  .tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
  .tag.requested{background:#E5EAF5;color:#3A5199;}
  .tag.due{background:#F7E9E5;color:var(--red);}
  .tag.partial{background:#FBF1DE;color:#8a6417;}
  .tag.paid{background:var(--green-soft);color:var(--green);}

  .detail-table{width:100%;border-collapse:collapse;margin-top:10px;border-radius:10px;overflow:hidden;
    box-shadow:0 1px 4px rgba(34,40,31,.06);}
  .detail-table th{background:var(--green);color:#fff;font-size:11.5px;padding:9px 8px;text-align:left;}
  .detail-table th.c,.detail-table td.c{text-align:center;}
  .detail-table td{padding:9px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  .detail-table tr:nth-child(even) td{background:var(--bg);}
  .detail-table tr:last-child td{border-bottom:none;}

  .bills-table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(34,40,31,.07);min-width:340px;}
  .bills-table th{background:var(--green);color:#fff;font-size:11px;padding:9px 7px;text-align:left;font-weight:700;}
  .bills-table th.c{text-align:center;}
  .bills-table td{padding:9px 7px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  .bills-table td.c{text-align:center;}
  .bills-table tr{cursor:pointer;}
  .bills-table tr:nth-child(odd) td{background:var(--card);}
  .bills-table tr:nth-child(even) td{background:var(--bg);}
  .bills-table tr:active td{background:var(--green-soft);}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mark">B</div>
    <div><h1>Baqala Trader</h1><p>Send your order</p></div>
  </div>

  <!-- STEP 1: PIN entry -->
  <div class="card" id="pin-step">
    <label>Enter your shop PIN</label>
    <input type="text" id="pin-input" placeholder="e.g. 1234" inputmode="numeric">
    <p class="err" id="pin-err">PIN not recognized. Please check and try again.</p>
    <div style="margin-top:14px;"><button class="btn btn-primary" id="pin-continue">Continue</button></div>
  </div>

  <!-- STEP 2: Order form -->
  <div id="order-step" class="hide">
    <div class="shop-banner">
      <div class="icon" id="shop-initials"></div>
      <div><p class="name" id="shop-name"></p><p class="sub" id="shop-sub">Add the items you need below</p></div>
    </div>

    <div class="tabs">
      <button class="active" id="tab-new">+ New order</button>
      <button id="tab-history">🧾 My bills</button>
    </div>

    <div id="new-order-panel">
      <label>Items needed</label>
      <div id="item-rows"></div>
      <button class="add-item-btn" id="add-item-btn">+ Add item</button>

      <div style="margin-top:20px;">
        <button class="btn btn-primary" id="submit-order">Send order</button>
      </div>
    </div>

    <div id="history-panel" class="hide">
      <div id="orders-history-list"></div>
    </div>
  </div>

  <!-- ORDER DETAIL -->
  <div id="detail-step" class="hide">
    <button class="btn btn-outline" id="detail-back" style="margin-bottom:16px;">← Back to orders</button>
    <div class="card">
      <div class="top-row" style="display:flex;justify-content:space-between;align-items:center;">
        <p style="font-weight:700;margin:0;" id="detail-date"></p>
        <span class="tag" id="detail-status"></span>
      </div>
      <table class="detail-table">
        <thead><tr><th style="width:12%;">#</th><th>Item</th><th class="c">Qty</th></tr></thead>
        <tbody id="detail-items"></tbody>
      </table>
      <div id="detail-total"></div>
      <div id="detail-view-bill-wrap"></div>
    </div>
  </div>

  <!-- STEP 3: Success -->
  <div id="success-step" class="hide">
    <div class="success">
      <span class="big">✅</span>
      <h2>Order sent</h2>
      <p>We'll prepare your bill and bring the items shortly.</p>
      <button class="btn btn-outline" id="send-another">Send another order</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zpomibqrmtjyscirzdvw.supabase.co";
const SUPABASE_KEY = "sb_publishable_nLudfpPOjErmQH5p8eTsxQ_fGTCFv3N";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentShop = null;
let products = [];
let shopOrders = [];

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=> t.className='toast', 2200);
}
function initials(name){ return (name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fmt(n){ return 'SAR ' + (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }

document.getElementById('pin-continue').addEventListener('click', async ()=>{
  const pin = document.getElementById('pin-input').value.trim();
  const errEl = document.getElementById('pin-err');
  errEl.style.display = 'none';
  if(!pin){ errEl.textContent='Please enter your PIN.'; errEl.style.display='block'; return; }

  const {data, error} = await sb.from('bt_shops').select('*').eq('pin', pin).maybeSingle();
  if(error || !data){
    errEl.textContent = 'PIN not recognized. Please check and try again.';
    errEl.style.display = 'block';
    return;
  }
  currentShop = data;
  document.getElementById('shop-initials').textContent = initials(data.name);
  document.getElementById('shop-name').textContent = data.name;
  document.getElementById('pin-step').classList.add('hide');
  document.getElementById('order-step').classList.remove('hide');

  const {data: prodData} = await sb.from('bt_products').select('*').order('name');
  products = prodData || [];
  addItemRow();
});

/* ---- Tabs ---- */
document.getElementById('tab-new').addEventListener('click', ()=>{
  document.getElementById('tab-new').classList.add('active');
  document.getElementById('tab-history').classList.remove('active');
  document.getElementById('new-order-panel').classList.remove('hide');
  document.getElementById('history-panel').classList.add('hide');
});
document.getElementById('tab-history').addEventListener('click', async ()=>{
  document.getElementById('tab-history').classList.add('active');
  document.getElementById('tab-new').classList.remove('active');
  document.getElementById('history-panel').classList.remove('hide');
  document.getElementById('new-order-panel').classList.add('hide');
  await loadOrderHistory();
});
async function loadOrderHistory(){
  const wrap = document.getElementById('orders-history-list');
  wrap.innerHTML = '<p style="color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0;">Loading...</p>';
  const {data, error} = await sb.from('bt_orders')
    .select('*, bt_order_items(*)')
    .eq('shop_id', currentShop.id)
    .order('order_date', {ascending:false})
    .order('created_at', {ascending:false});
  if(error){ wrap.innerHTML = '<p class="err" style="display:block;">Could not load orders.</p>'; return; }
  shopOrders = data || [];
  if(shopOrders.length===0){
    wrap.innerHTML = '<p style="color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0;">No past orders yet.</p>';
    return;
  }

  const rowsHtml = shopOrders.map((o,idx)=>{
    const itemCount = (o.bt_order_items||[]).length;
    const dateStr = new Date(o.order_date).toLocaleDateString('en-GB');
    const billNo = o.bill_number ? '#'+String(o.bill_number).padStart(4,'0') : '—';
    const paid = Number(o.amount_paid)||0;
    const balance = Number(o.total_amount) - paid;

    const detailCell = o.status==='requested'
      ? `<span style="font-weight:700;">${dateStr}</span> <span style="color:var(--ink-soft);">· ${itemCount} item${itemCount!==1?'s':''}</span>`
      : `<span style="font-weight:700;">${dateStr}</span> <span style="color:var(--ink-soft);">${billNo}</span>`;

    const amountCell = o.status==='requested' ? '—' : fmt(o.total_amount);
    const paidCell = o.status==='requested' ? '—' : fmt(paid);
    const balanceCell = o.status==='requested' ? '—' : fmt(balance);
    const balanceColor = o.status==='requested' ? 'var(--ink-soft)' : (balance>0.01 ? 'var(--red)' : 'var(--green)');

    return `<tr onclick="viewOrderDetail(${idx})">
      <td style="white-space:nowrap;">${detailCell}<br><span class="tag ${o.status}" style="margin-top:3px;display:inline-block;">${o.status}</span></td>
      <td class="c">${amountCell}</td>
      <td class="c" style="color:var(--green);font-weight:700;">${paidCell}</td>
      <td class="c" style="color:${balanceColor};font-weight:700;">${balanceCell}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <div style="overflow-x:auto;">
      <table class="bills-table">
        <colgroup><col style="width:46%;"><col style="width:18%;"><col style="width:18%;"><col style="width:18%;"></colgroup>
        <thead><tr><th>Details</th><th class="c">Bill</th><th class="c">Paid</th><th class="c">Balance</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
}
window.viewOrderDetail = function(idx){
  const o = shopOrders[idx];
  const items = o.bt_order_items || [];
  document.getElementById('order-step').classList.add('hide');
  document.getElementById('detail-step').classList.remove('hide');
  const billNo = o.bill_number ? 'Bill #'+String(o.bill_number).padStart(4,'0') : new Date(o.order_date).toDateString();
  document.getElementById('detail-date').textContent = billNo;
  document.getElementById('detail-status').textContent = o.status;
  document.getElementById('detail-status').className = 'tag ' + o.status;
  document.getElementById('detail-items').innerHTML = items.map((i,n)=>`
    <tr><td class="c">${n+1}</td><td>${i.product_name}</td><td class="c">${i.quantity}</td></tr>
  `).join('');

  const paid = Number(o.amount_paid)||0;
  const balance = Number(o.total_amount) - paid;
  let totalHtml;
  if(o.status==='requested'){
    totalHtml = `<p style="text-align:center;color:var(--ink-soft);margin-top:10px;">Waiting for price to be added</p>`;
  } else {
    totalHtml = `
      <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;">
        <span style="color:var(--ink-soft);">Total</span><span style="font-weight:700;">${fmt(o.total_amount)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:13.5px;">
        <span style="color:var(--ink-soft);">Paid</span><span style="font-weight:700;color:var(--green);">${fmt(paid)}</span>
      </div>
      ${balance > 0.01 ? `<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:13.5px;">
        <span style="color:var(--ink-soft);">Balance remaining</span><span style="font-weight:700;color:var(--red);">${fmt(balance)}</span>
      </div>` : `<p style="text-align:center;color:var(--green);font-weight:700;margin-top:8px;">✅ Fully paid</p>`}
    `;
  }
  document.getElementById('detail-total').innerHTML = totalHtml;
  document.getElementById('detail-view-bill-wrap').innerHTML = o.status!=='requested'
    ? `<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="viewPreparedBill(${idx})">🧾 View bill</button>`
    : '';
};
function viewPreparedBill(idx){
  const o = shopOrders[idx];
  const items = o.bt_order_items || [];
  const billNo = o.bill_number ? String(o.bill_number).padStart(4,'0') : '----';
  const dateStr = new Date(o.order_date).toLocaleDateString('en-GB');
  const rows = items.map(i=>`
    <tr><td class="desc">${i.product_name}</td><td class="c">${i.quantity}</td><td class="c">${Number(i.unit_price).toFixed(2)}</td><td class="c">${Number(i.line_total).toFixed(2)}</td></tr>`).join('');
  const blankRows = Array.from({length: Math.max(0, 8 - items.length)}).map(()=>`
    <tr><td class="desc">&nbsp;</td><td class="c"></td><td class="c"></td><td class="c"></td></tr>`).join('');
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>Bill — ${currentShop.name}</title>
    <style>
      @page { size: 21cm 15cm; margin: 6mm 6mm 2.54cm 6mm; }
      *{box-sizing:border-box;} html,body{height:100%;}
      body{font-family:Arial,Tahoma,sans-serif;color:#1a1a1a;margin:0;padding:0;font-size:11.5px;}
      .sheet{width:100%;padding:2mm;min-height:100%;display:flex;flex-direction:column;}
      .head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px;}
      .head .en{text-align:left;flex:1;} .head .ar{text-align:right;direction:rtl;flex:1;}
      .head .brand{font-size:18px;font-weight:bold;margin:0;color:#1a3b8f;}
      .head .brand-ar{font-size:21px;font-weight:bold;margin:0;color:#1a3b8f;}
      .head .sub{font-size:11px;color:#1a3b8f;margin:2px 0 0;font-weight:bold;}
      .head .ref{font-size:11px;color:#8B0000;font-weight:bold;margin-top:3px;}
      .head .center{text-align:center;flex:1;}
      .head .cart{font-size:34px;line-height:1;}
      .head .fatura-ar{font-size:16px;font-weight:bold;color:#1a3b8f;margin:3px 0 0;direction:rtl;}
      .head .fatura-en{font-size:13px;font-weight:bold;color:#1a3b8f;margin:1px 0 0;letter-spacing:1.5px;}
      .meta{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:10px;padding:0 2px;}
      .meta .ar{direction:rtl;}
      .table-wrap{border:3px double #1a3b8f;border-radius:12px;overflow:hidden;margin-top:4px;flex:1;display:flex;flex-direction:column;}
      table{width:100%;height:100%;border-collapse:collapse;}
      th,td{border:1px solid #3a5199;padding:5px 7px;font-size:11.5px;}
      th{background:#f0f0ee;text-align:center;font-weight:bold;}
      th .en{display:block;font-size:10.5px;} th .ar{display:block;font-size:10.5px;direction:rtl;color:#333;}
      td.desc{text-align:left;} td.c{text-align:center;}
      .total-row td{font-weight:bold;background:#f7f5f0;} .total-row td.desc{text-align:right;direction:rtl;}
      .foot{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;}
      .foot .line{border-top:1px solid #000;width:140px;text-align:center;padding-top:4px;}
      .noprint{text-align:center;margin-top:16px;}
      .noprint button{background:#1F4D3A;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;}
    </style></head>
    <body>
      <div class="sheet">
        <div class="head">
          <div class="en"><p class="brand">Supplies</p><p class="sub">For foodstuffs</p><p class="ref">Bill No: ${billNo} &nbsp;|&nbsp; ${dateStr}</p></div>
          <div class="center"><div class="cart">🛒</div><p class="fatura-ar">فاتورة</p><p class="fatura-en">INVOICE</p></div>
          <div class="ar"><p class="brand-ar">تموينات</p><p class="sub">للمواد الغذائية</p></div>
        </div>
        <div class="meta">
          <div>Customer: <strong>${currentShop.name}</strong></div>
          <div class="ar">العميل: <strong>${currentShop.name}</strong></div>
        </div>
        <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:42%;"><span class="en">Description</span><span class="ar">البيان</span></th>
            <th style="width:16%;"><span class="en">Qty</span><span class="ar">العدد</span></th>
            <th style="width:21%;"><span class="en">Unit Price</span><span class="ar">السعر الإفرادي</span></th>
            <th style="width:21%;"><span class="en">Total Price</span><span class="ar">السعر الإجمالي</span></th>
          </tr></thead>
          <tbody>
            ${rows}${blankRows}
            <tr class="total-row"><td class="desc" colspan="3">Total / الإجمالي</td><td class="c">SAR ${Number(o.total_amount).toFixed(2)}</td></tr>
          </tbody>
        </table>
        </div>
        <div class="foot"><div class="line">Signature / التوقيع</div><div class="line">Date / التاريخ</div></div>
        <div class="noprint"><button onclick="window.print()">Print this bill</button></div>
      </div>
    </body></html>
  `);
  w.document.close();
}
document.getElementById('detail-back').addEventListener('click', ()=>{
  document.getElementById('detail-step').classList.add('hide');
  document.getElementById('order-step').classList.remove('hide');
});

let rowCount = 0;
function getCategories(){
  return [...new Set(products.map(p=>p.category).filter(Boolean))];
}
function addItemRow(){
  rowCount++;
  const rid = 'row-'+rowCount;
  const categories = getCategories();
  const catOptions = '<option value="">Category...</option>' + categories.map(c=>`<option value="${c}">${c}</option>`).join('')
    + '<option value="__uncat__">Other items</option>';
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = rid;
  div.innerHTML = `
    <span class="row-icon">🧺</span>
    <div class="row-selects">
      <select class="i-category" onchange="onCategoryChange('${rid}', this.value)">${catOptions}</select>
      <select class="i-product" disabled><option value="">Pick a category first</option></select>
    </div>
    <input type="number" class="i-qty" placeholder="Qty" min="0" step="0.5">
    <button class="rm" onclick="document.getElementById('${rid}').remove()">✕</button>
  `;
  document.getElementById('item-rows').appendChild(div);
}
window.onCategoryChange = function(rid, category){
  const row = document.getElementById(rid);
  const productSel = row.querySelector('.i-product');
  let matching;
  if(category === '__uncat__'){
    matching = products.filter(p=>!p.category);
  } else if(category){
    matching = products.filter(p=>p.category===category);
  } else {
    matching = [];
  }
  if(matching.length===0){
    productSel.disabled = true;
    productSel.innerHTML = '<option value="">No items in this category yet</option>';
    return;
  }
  productSel.disabled = false;
  productSel.innerHTML = '<option value="">Choose item...</option>' + matching.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
};
document.getElementById('add-item-btn').addEventListener('click', addItemRow);

document.getElementById('submit-order').addEventListener('click', async ()=>{
  const rows = document.querySelectorAll('#item-rows .item-row');
  const items = [];
  rows.forEach(r=>{
    const productId = r.querySelector('.i-product').value;
    const qty = parseFloat(r.querySelector('.i-qty').value) || 0;
    const product = products.find(p=>p.id===productId);
    if(product && qty>0){
      items.push({ name: product.name, qty, product_id: product.id });
    }
  });
  if(items.length===0){ toast('Pick at least one item and enter a quantity', true); return; }

  const btn = document.getElementById('submit-order');
  btn.disabled = true; btn.textContent = 'Sending...';

  const {data: orderData, error: orderErr} = await sb.from('bt_orders').insert({
    shop_id: currentShop.id, order_date: new Date().toISOString().slice(0,10),
    total_amount: 0, total_cost: 0, status: 'requested'
  }).select().single();

  if(orderErr){ toast(orderErr.message, true); btn.disabled=false; btn.textContent='Send order'; return; }

  const itemsPayload = items.map(i=>({
    order_id: orderData.id, product_id: i.product_id, product_name: i.name,
    quantity: i.qty, unit_cost: 0, unit_price: 0
  }));
  const {error: itemsErr} = await sb.from('bt_order_items').insert(itemsPayload);
  if(itemsErr){ toast(itemsErr.message, true); btn.disabled=false; btn.textContent='Send order'; return; }

  document.getElementById('order-step').classList.add('hide');
  document.getElementById('success-step').classList.remove('hide');
});

document.getElementById('send-another').addEventListener('click', ()=>{
  document.getElementById('success-step').classList.add('hide');
  document.getElementById('item-rows').innerHTML = '';
  document.getElementById('pin-input').value = '';
  document.getElementById('order-step').classList.add('hide');
  document.getElementById('pin-step').classList.remove('hide');
  document.getElementById('tab-new').classList.add('active');
  document.getElementById('tab-history').classList.remove('active');
  document.getElementById('new-order-panel').classList.remove('hide');
  document.getElementById('history-panel').classList.add('hide');
});
</script>
</body>
</html>
