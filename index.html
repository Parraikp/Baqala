<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baqala Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#1F4D3A;
    --green-dark:#153529;
    --marigold:#E2A33D;
    --bg:#F6F7F3;
    --card:#FFFFFF;
    --ink:#22281F;
    --ink-soft:#5C6459;
    --line:#E4E7DF;
    --red:#B3452E;
    --green-soft:#EAF3EC;
    --marigold-soft:#FBF1DE;
    --red-soft:#F7E9E5;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}

  /* Header */
  header{
    padding:18px 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:var(--bg);z-index:10;
  }
  header .brand{display:flex;align-items:center;gap:9px;}
  header .brand .mark{
    width:32px;height:32px;border-radius:9px;background:var(--green);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Space Grotesk';
  }
  header h1{font-size:17px;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:var(--ink-soft);margin:0;}
  #conn-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;}
  #conn-dot.ok{background:var(--green);}
  #conn-dot.bad{background:var(--red);}

  main{padding:0 16px 16px;}
  .view{display:none;}
  .view.active{display:block;}

  /* Cards */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--line);}
  .stat .label{font-size:12px;color:var(--ink-soft);margin:0 0 4px;}
  .stat .num{font-size:21px;font-weight:600;margin:0;}
  .stat.due .num{color:var(--red);}
  .stat.profit .num{color:var(--green);}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
  .section-title h2{font-size:14px;font-weight:600;margin:0;color:var(--ink);}
  .section-title a{font-size:12px;color:var(--green);cursor:pointer;font-weight:500;}

  .list{display:flex;flex-direction:column;gap:8px;}
  .row-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;
  }
  .row-card .icon{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;
    background:var(--green-soft);color:var(--green);
  }
  .row-card .body{flex:1;min-width:0;}
  .row-card .title{font-size:14px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-card .meta{font-size:12px;color:var(--ink-soft);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-card .right{text-align:right;flex-shrink:0;}
  .row-card .amount{font-size:14px;font-weight:600;margin:0;}
  .row-card .tag{font-size:11px;margin:2px 0 0;padding:1px 7px;border-radius:20px;display:inline-block;}
  .tag.due{background:var(--red-soft);color:var(--red);}
  .tag.paid{background:var(--green-soft);color:var(--green);}
  .tag.partial{background:var(--marigold-soft);color:#8a6417;}
  .tag.requested{background:#E5EAF5;color:#3A5199;}

  .empty{text-align:center;padding:36px 16px;color:var(--ink-soft);font-size:13px;}
  .empty .big{font-size:32px;display:block;margin-bottom:6px;}

  /* Buttons */
  .btn{
    border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:'Inter';display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--green);color:#fff;width:100%;}
  .btn-primary:active{background:var(--green-dark);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-text{background:transparent;color:var(--green);padding:8px 4px;}
  .btn-danger-text{background:transparent;color:var(--red);padding:8px 4px;}
  .fab{
    position:fixed;bottom:88px;right:calc(50% - 240px + 18px);
    width:54px;height:54px;border-radius:50%;background:var(--marigold);color:#fff;
    border:none;font-size:26px;box-shadow:0 6px 16px rgba(226,163,61,.45);cursor:pointer;z-index:20;
    display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:520px){.fab{right:18px;}}

  /* Bottom nav */
  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;
    max-width:480px;margin:0 auto;z-index:30;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;padding:9px 0 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-family:'Inter';
  }
  nav.tabbar button svg{width:20px;height:20px;}
  nav.tabbar button span{font-size:10.5px;font-weight:500;}
  nav.tabbar button.active{color:var(--green);}

  /* Modal / sheet */
  .sheet-backdrop{
    display:none;position:fixed;inset:0;background:rgba(20,25,18,.45);z-index:50;
    align-items:flex-end;justify-content:center;
  }
  .sheet-backdrop.active{display:flex;}
  .sheet{
    background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    max-height:88vh;overflow-y:auto;padding:16px 18px 24px;
  }
  .sheet .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet .sheet-head h3{margin:0;font-size:16px;}
  .sheet .close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:4px;}

  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin:12px 0 5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;font-family:'Inter';background:var(--card);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px;}

  .item-row{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;
    display:flex;flex-direction:column;gap:8px;
  }
  .item-row .top{display:flex;gap:8px;align-items:center;}
  .item-row .top select{flex:1;}
  .item-row .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .item-row .grid3 div span{font-size:10.5px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .item-row .rm{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;padding:2px 4px;flex-shrink:0;}
  .add-item-btn{width:100%;margin-top:8px;border:1.5px dashed var(--line);background:none;border-radius:10px;
    padding:10px;color:var(--green);font-weight:600;font-size:13px;cursor:pointer;}

  .order-total{
    display:flex;justify-content:space-between;align-items:center;margin-top:14px;
    padding:12px 14px;background:var(--green-soft);border-radius:10px;
  }
  .order-total .num{color:var(--green);font-size:18px;font-weight:600;}
  .profit-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-align:right;}

  .detail-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .detail-tabs button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .detail-tabs button.active{background:var(--green);color:#fff;border-color:var(--green);}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s;
  }
  .toast.show{opacity:1;bottom:110px;}
  .toast.err{background:var(--red);}

  .setup-banner{
    background:var(--marigold-soft);border:1px solid var(--marigold);border-radius:12px;padding:14px;
    font-size:13px;line-height:1.5;margin-bottom:16px;
  }
  .product-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .product-row .pname{font-size:13.5px;font-weight:600;}
  .product-row .pmeta{font-size:11.5px;color:var(--ink-soft);}
  .product-row .pedit{background:none;border:none;color:var(--green);font-size:12px;cursor:pointer;font-weight:600;}

  .spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--green);
    border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="mark">B</div>
      <div>
        <h1 id="header-title">Baqala Trader</h1>
        <p class="sub"><span id="conn-dot"></span> <span id="conn-text">Connecting...</span></p>
      </div>
    </div>
  </header>

  <main>

    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="stat-grid">
        <div class="stat profit">
          <p class="label">This month profit</p>
          <p class="num" id="stat-profit">SAR 0</p>
        </div>
        <div class="stat due">
          <p class="label">Total dues</p>
          <p class="num" id="stat-due">SAR 0</p>
        </div>
      </div>

      <div id="pending-requests-block"></div>

      <div class="section-title">
        <h2>Recent orders</h2>
        <a onclick="goto('orders')">See all</a>
      </div>
      <div class="list" id="home-recent-orders"><div class="spinner"></div></div>
    </section>

    <!-- SHOPS -->
    <section class="view" id="view-shops">
      <div class="section-title">
        <h2>Shops</h2>
        <a onclick="openShopForm()">+ Add shop</a>
      </div>
      <div class="list" id="shops-list"><div class="spinner"></div></div>
    </section>

    <!-- ORDERS -->
    <section class="view" id="view-orders">
      <div class="section-title">
        <h2>All orders</h2>
      </div>
      <div class="list" id="orders-list"><div class="spinner"></div></div>
    </section>

    <!-- REPORTS -->
    <section class="view" id="view-reports">
      <div class="section-title"><h2>This month</h2></div>
      <div class="stat-grid">
        <div class="stat"><p class="label">Orders</p><p class="num" id="rep-orders">0</p></div>
        <div class="stat profit"><p class="label">Profit</p><p class="num" id="rep-profit">SAR 0</p></div>
        <div class="stat"><p class="label">Collected</p><p class="num" id="rep-collected">SAR 0</p></div>
        <div class="stat due"><p class="label">Outstanding</p><p class="num" id="rep-outstanding">SAR 0</p></div>
      </div>
      <div class="section-title"><h2>Shops by amount due</h2></div>
      <div class="list" id="rep-shops"><div class="spinner"></div></div>

      <div class="section-title"><h2>Products</h2><a onclick="openProductForm()">+ Add product</a></div>
      <div id="products-list"><div class="spinner"></div></div>
    </section>

  </main>

  <button class="fab" onclick="openOrderForm()">+</button>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="home" onclick="goto('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="tab-btn" data-view="shops" onclick="goto('shops')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>
      <span>Shops</span>
    </button>
    <button class="tab-btn" data-view="orders" onclick="goto('orders')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2l1 4h10l1-4"/><rect x="4" y="6" width="16" height="15" rx="2"/></svg>
      <span>Orders</span>
    </button>
    <button class="tab-btn" data-view="reports" onclick="goto('reports')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Reports</span>
    </button>
  </nav>

</div>

<!-- SHEETS -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" id="sheet-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = "https://zpomibqrmtjyscirzdvw.supabase.co";
const SUPABASE_KEY = "sb_publishable_nLudfpPOjErmQH5p8eTsxQ_fGTCFv3N";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ STATE ============ */
let SHOPS = [], PRODUCTS = [], ORDERS = [], BALANCES = [];

/* ============ HELPERS ============ */
function fmt(n){ return 'SAR ' + (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=> t.className='toast', 2200);
}
function initials(name){ return (name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function closeSheet(){ document.getElementById('sheet-backdrop').classList.remove('active'); document.getElementById('sheet-content').innerHTML=''; }
function openSheet(html){
  document.getElementById('sheet-content').innerHTML = html;
  document.getElementById('sheet-backdrop').classList.add('active');
}
document.getElementById('sheet-backdrop').addEventListener('click', e=>{
  if(e.target.id==='sheet-backdrop') closeSheet();
});

/* ============ NAV ============ */
function goto(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const titles = {home:'Baqala Trader', shops:'Shops', orders:'Orders', reports:'Reports'};
  document.getElementById('header-title').textContent = titles[view];
  if(view==='reports') renderReports();
}

/* ============ LOAD DATA ============ */
async function loadAll(){
  try{
    const [shopsR, productsR, balancesR] = await Promise.all([
      sb.from('bt_shops').select('*').order('name'),
      sb.from('bt_products').select('*').order('name'),
      sb.from('bt_shop_balances').select('*')
    ]);
    if(shopsR.error) throw shopsR.error;
    SHOPS = shopsR.data || [];
    PRODUCTS = productsR.data || [];
    BALANCES = balancesR.data || [];

    const ordersR = await sb.from('bt_orders')
      .select('*, bt_shops(name), bt_order_items(*)')
      .order('order_date', {ascending:false})
      .order('created_at', {ascending:false});
    if(ordersR.error) throw ordersR.error;
    ORDERS = ordersR.data || [];

    setConn(true);
    renderHome();
    renderShops();
    renderOrders();
    renderProducts();
  }catch(err){
    console.error(err);
    setConn(false, err.message);
    toast('Could not load data: ' + err.message, true);
  }
}
function setConn(ok, msg){
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  dot.className = ok ? 'ok' : 'bad';
  txt.textContent = ok ? 'Connected' : ('Connection error');
}

/* ============ HOME ============ */
function renderHome(){
  const now = new Date();
  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  let profit = 0;
  ORDERS.forEach(o=>{
    if((o.order_date||'').startsWith(ym)){
      (o.bt_order_items||[]).forEach(it=> profit += Number(it.line_profit||0));
    }
  });
  const totalDue = BALANCES.reduce((s,b)=> s + Number(b.balance_due||0), 0);
  document.getElementById('stat-profit').textContent = fmt(profit);
  document.getElementById('stat-due').textContent = fmt(totalDue);

  const pending = ORDERS.filter(o=>o.status==='requested');
  const pendBlock = document.getElementById('pending-requests-block');
  if(pending.length){
    pendBlock.innerHTML = `
      <div class="setup-banner" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="goto('orders')">
        <span><strong>${pending.length} new request${pending.length!==1?'s':''}</strong> waiting to be priced</span>
        <span style="color:var(--green);font-weight:600;">Review →</span>
      </div>`;
  } else { pendBlock.innerHTML = ''; }

  const wrap = document.getElementById('home-recent-orders');
  const recent = ORDERS.slice(0,6);
  if(recent.length===0){
    wrap.innerHTML = emptyState('📦','No orders yet','Tap the + button to add your first order.');
    return;
  }
  wrap.innerHTML = recent.map(orderCardHTML).join('');
}

function emptyState(icon, title, sub){
  return `<div class="empty"><span class="big">${icon}</span><strong>${title}</strong><br>${sub}</div>`;
}

function orderCardHTML(o){
  const shopName = o.bt_shops?.name || 'Unknown shop';
  const itemCount = (o.bt_order_items||[]).length;
  const itemsLabel = (o.bt_order_items||[]).slice(0,2).map(i=>i.product_name).join(', ') + (itemCount>2 ? ` +${itemCount-2} more` : '');
  return `<div class="row-card" onclick="viewOrder('${o.id}')">
    <div class="icon">${initials(shopName)}</div>
    <div class="body">
      <p class="title">${shopName}</p>
      <p class="meta">${itemsLabel || 'No items'} · ${itemCount} item${itemCount!==1?'s':''}</p>
    </div>
    <div class="right">
      <p class="amount">${fmt(o.total_amount)}</p>
      <span class="tag ${o.status}">${o.status}</span>
    </div>
  </div>`;
}

/* ============ SHOPS ============ */
function renderShops(){
  const wrap = document.getElementById('shops-list');
  if(SHOPS.length===0){
    wrap.innerHTML = emptyState('🏪','No shops yet','Add the grocery shops you supply to.');
    return;
  }
  wrap.innerHTML = SHOPS.map(s=>{
    const bal = BALANCES.find(b=>b.shop_id===s.id);
    const due = bal ? Number(bal.balance_due) : 0;
    return `<div class="row-card" onclick="viewShop('${s.id}')">
      <div class="icon">${initials(s.name)}</div>
      <div class="body">
        <p class="title">${s.name}</p>
        <p class="meta">${s.contact_number || 'No contact number'}</p>
      </div>
      <div class="right">
        <p class="amount" style="${due>0?'color:var(--red)':'color:var(--green)'}">${fmt(due)}</p>
        <span class="tag ${due>0?'due':'paid'}">${due>0?'due':'clear'}</span>
      </div>
    </div>`;
  }).join('');
}

function openShopForm(existing){
  const s = existing || {};
  openSheet(`
    <div class="sheet-head"><h3>${existing?'Edit shop':'Add shop'}</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <label>Shop name</label>
    <input type="text" id="f-shop-name" value="${s.name||''}" placeholder="e.g. Al Noor grocery">
    <label>Contact number</label>
    <input type="text" id="f-shop-phone" value="${s.contact_number||''}" placeholder="05xxxxxxxx">
    <label>Address</label>
    <input type="text" id="f-shop-address" value="${s.address||''}" placeholder="Optional">
    <label>Order PIN <span style="font-weight:400;color:var(--ink-soft);">(give this to the shopkeeper)</span></label>
    <input type="text" id="f-shop-pin" value="${s.pin||''}" placeholder="e.g. 1234" inputmode="numeric">
    <label>Notes</label>
    <textarea id="f-shop-notes" rows="2" placeholder="Optional">${s.notes||''}</textarea>
    <div style="margin-top:18px;"><button class="btn btn-primary" onclick="saveShop('${existing?existing.id:''}')">Save shop</button></div>
  `);
}
async function saveShop(id){
  const name = document.getElementById('f-shop-name').value.trim();
  if(!name){ toast('Shop name is required', true); return; }
  const pin = document.getElementById('f-shop-pin').value.trim();
  const payload = {
    name,
    contact_number: document.getElementById('f-shop-phone').value.trim(),
    address: document.getElementById('f-shop-address').value.trim(),
    pin: pin || null,
    notes: document.getElementById('f-shop-notes').value.trim()
  };
  const q = id ? sb.from('bt_shops').update(payload).eq('id', id) : sb.from('bt_shops').insert(payload);
  const {error} = await q;
  if(error){ toast(error.message, true); return; }
  toast('Shop saved');
  closeSheet();
  await loadAll();
}

async function viewShop(id){
  const s = SHOPS.find(x=>x.id===id);
  if(!s) return;
  const bal = BALANCES.find(b=>b.shop_id===id) || {total_ordered:0,total_paid:0,balance_due:0};
  const shopOrders = ORDERS.filter(o=>o.shop_id===id);
  openSheet(`
    <div class="sheet-head"><h3>${s.name}</h3><button class="close" onclick="closeSheet()">✕</button></div>
    ${s.pin ? `<div class="setup-banner">Order PIN: <strong>${s.pin}</strong><br>Share the order link + this PIN with the shopkeeper so they can send requests directly.</div>` : ''}
    <div class="stat-grid">
      <div class="stat"><p class="label">Total ordered</p><p class="num">${fmt(bal.total_ordered)}</p></div>
      <div class="stat due"><p class="label">Balance due</p><p class="num">${fmt(bal.balance_due)}</p></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-outline" style="flex:1" onclick="openShopForm(SHOPS.find(x=>x.id==='${id}'))">Edit shop</button>
      <button class="btn btn-primary" style="flex:1" onclick="openPaymentForm('${id}')">Record payment</button>
    </div>
    <div class="section-title" style="margin-top:6px;"><h2>Order history</h2></div>
    <div class="list">${shopOrders.length ? shopOrders.map(orderCardHTML).join('') : emptyState('📦','No orders yet','')}</div>
  `);
}

/* ============ PAYMENTS ============ */
function openPaymentForm(shopId){
  openSheet(`
    <div class="sheet-head"><h3>Record payment</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <label>Amount (SAR)</label>
    <input type="number" id="f-pay-amount" placeholder="0.00" step="0.01">
    <label>Date</label>
    <input type="date" id="f-pay-date" value="${new Date().toISOString().slice(0,10)}">
    <label>Method</label>
    <select id="f-pay-method">
      <option value="cash">Cash</option>
      <option value="bank transfer">Bank transfer</option>
      <option value="other">Other</option>
    </select>
    <label>Note</label>
    <input type="text" id="f-pay-note" placeholder="Optional">
    <div style="margin-top:18px;"><button class="btn btn-primary" onclick="savePayment('${shopId}')">Save payment</button></div>
  `);
}
async function savePayment(shopId){
  const amount = parseFloat(document.getElementById('f-pay-amount').value);
  if(!amount || amount<=0){ toast('Enter a valid amount', true); return; }
  const payload = {
    shop_id: shopId,
    amount,
    payment_date: document.getElementById('f-pay-date').value,
    method: document.getElementById('f-pay-method').value,
    note: document.getElementById('f-pay-note').value.trim()
  };
  const {error} = await sb.from('bt_payments').insert(payload);
  if(error){ toast(error.message, true); return; }
  toast('Payment recorded');
  closeSheet();
  await loadAll();
}

/* ============ ORDERS ============ */
function renderOrders(){
  const wrap = document.getElementById('orders-list');
  if(ORDERS.length===0){
    wrap.innerHTML = emptyState('📦','No orders yet','Tap the + button to add your first order.');
    return;
  }
  wrap.innerHTML = ORDERS.map(orderCardHTML).join('');
}

let itemRowCount = 0;
function openOrderForm(){
  if(SHOPS.length===0){
    toast('Add a shop first', true);
    return;
  }
  itemRowCount = 0;
  const shopOptions = SHOPS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  openSheet(`
    <div class="sheet-head"><h3>New order</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <label>Shop</label>
    <select id="f-order-shop">${shopOptions}</select>
    <label>Order date</label>
    <input type="date" id="f-order-date" value="${new Date().toISOString().slice(0,10)}">
    <label style="margin-top:16px;">Items</label>
    <div id="item-rows"></div>
    <button class="add-item-btn" onclick="addItemRow()">+ Add item</button>
    <div class="order-total">
      <span>Order total</span>
      <span class="num" id="order-total-display">SAR 0</span>
    </div>
    <p class="profit-note" id="order-profit-note">Expected profit: SAR 0</p>
    <div style="margin-top:16px;"><button class="btn btn-primary" onclick="saveOrder()">Save order</button></div>
  `);
  addItemRow();
}

function addItemRow(){
  itemRowCount++;
  const rid = 'item-'+itemRowCount;
  const productOptions = '<option value="">Manual entry</option>' + PRODUCTS.map(p=>`<option value="${p.id}" data-cost="${p.cost_price}" data-price="${p.sell_price}" data-name="${p.name}">${p.name}</option>`).join('');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = rid;
  div.innerHTML = `
    <div class="top">
      <select onchange="fillFromProduct('${rid}', this)">${productOptions}</select>
      <button class="rm" onclick="document.getElementById('${rid}').remove(); updateOrderTotal();">Remove</button>
    </div>
    <input type="text" class="i-name" placeholder="Item name" oninput="updateOrderTotal()">
    <div class="grid3">
      <div><span>Qty</span><input type="number" class="i-qty" value="1" min="0" step="0.01" oninput="updateOrderTotal()"></div>
      <div><span>Cost (SAR)</span><input type="number" class="i-cost" value="0" min="0" step="0.01" oninput="updateOrderTotal()"></div>
      <div><span>Price (SAR)</span><input type="number" class="i-price" value="0" min="0" step="0.01" oninput="updateOrderTotal()"></div>
    </div>
  `;
  document.getElementById('item-rows').appendChild(div);
  updateOrderTotal();
}
function fillFromProduct(rid, sel){
  const opt = sel.selectedOptions[0];
  const row = document.getElementById(rid);
  if(opt.value){
    row.querySelector('.i-name').value = opt.dataset.name;
    row.querySelector('.i-cost').value = opt.dataset.cost;
    row.querySelector('.i-price').value = opt.dataset.price;
  }
  updateOrderTotal();
}
function collectItems(){
  const rows = document.querySelectorAll('#item-rows .item-row');
  const items = [];
  rows.forEach(r=>{
    const name = r.querySelector('.i-name').value.trim();
    const qty = parseFloat(r.querySelector('.i-qty').value)||0;
    const cost = parseFloat(r.querySelector('.i-cost').value)||0;
    const price = parseFloat(r.querySelector('.i-price').value)||0;
    const productSel = r.querySelector('select');
    if(name && qty>0){
      items.push({ name, qty, cost, price, product_id: productSel.value || null });
    }
  });
  return items;
}
function updateOrderTotal(){
  const items = collectItems();
  const total = items.reduce((s,i)=> s + i.qty*i.price, 0);
  const cost = items.reduce((s,i)=> s + i.qty*i.cost, 0);
  document.getElementById('order-total-display').textContent = fmt(total);
  document.getElementById('order-profit-note').textContent = 'Expected profit: ' + fmt(total-cost);
}
async function saveOrder(){
  const shopId = document.getElementById('f-order-shop').value;
  const date = document.getElementById('f-order-date').value;
  const items = collectItems();
  if(items.length===0){ toast('Add at least one item', true); return; }
  const total = items.reduce((s,i)=> s + i.qty*i.price, 0);
  const cost = items.reduce((s,i)=> s + i.qty*i.cost, 0);

  const {data: orderData, error: orderErr} = await sb.from('bt_orders').insert({
    shop_id: shopId, order_date: date, total_amount: total, total_cost: cost, status:'due'
  }).select().single();
  if(orderErr){ toast(orderErr.message, true); return; }

  const itemsPayload = items.map(i=>({
    order_id: orderData.id, product_id: i.product_id, product_name: i.name,
    quantity: i.qty, unit_cost: i.cost, unit_price: i.price
  }));
  const {error: itemsErr} = await sb.from('bt_order_items').insert(itemsPayload);
  if(itemsErr){ toast(itemsErr.message, true); return; }

  toast('Order saved');
  closeSheet();
  await loadAll();
}

function viewOrder(id){
  const o = ORDERS.find(x=>x.id===id);
  if(!o) return;
  if(o.status === 'requested'){ openPricingForm(o); return; }

  const shopName = o.bt_shops?.name || 'Unknown shop';
  const items = o.bt_order_items || [];
  openSheet(`
    <div class="sheet-head"><h3>${shopName}</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <p style="color:var(--ink-soft);font-size:12.5px;margin:-6px 0 14px;">${new Date(o.order_date).toDateString()} · <span class="tag ${o.status}">${o.status}</span></p>
    <div class="list">
      ${items.map(i=>`<div class="row-card" style="cursor:default;">
        <div class="body">
          <p class="title">${i.product_name}</p>
          <p class="meta">${i.quantity} × ${fmt(i.unit_price)}</p>
        </div>
        <div class="right"><p class="amount">${fmt(i.line_total)}</p></div>
      </div>`).join('')}
    </div>
    <div class="order-total"><span>Total</span><span class="num">${fmt(o.total_amount)}</span></div>
    <p class="profit-note">Profit on this order: ${fmt(o.total_amount - o.total_cost)}</p>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-outline" style="flex:1" onclick="printBill('${o.id}')">Print bill</button>
      ${o.status !== 'paid' ? `<button class="btn btn-primary" style="flex:1" onclick="openPaymentForm('${o.shop_id}')">Record payment</button>` : ''}
    </div>
  `);
}

/* ---- Requests: pricing screen ---- */
function openPricingForm(o){
  const shopName = o.bt_shops?.name || 'Unknown shop';
  const items = o.bt_order_items || [];
  const rowsHtml = items.map((i, idx)=>{
    const match = PRODUCTS.find(p=>p.id===i.product_id);
    const defCost = match ? match.cost_price : '';
    const defPrice = match ? match.sell_price : '';
    return `<div class="item-row" data-item-id="${i.id}">
      <div class="top"><strong style="font-size:13.5px;">${i.product_name}</strong><span style="margin-left:auto;font-size:12.5px;color:var(--ink-soft);">Qty ${i.quantity}</span></div>
      <div class="grid3">
        <div><span>Qty</span><input type="number" class="p-qty" value="${i.quantity}" min="0" step="0.5" oninput="updatePricingTotal()"></div>
        <div><span>Your cost</span><input type="number" class="p-cost" value="${defCost}" min="0" step="0.01" oninput="updatePricingTotal()"></div>
        <div><span>Sell price</span><input type="number" class="p-price" value="${defPrice}" min="0" step="0.01" oninput="updatePricingTotal()"></div>
      </div>
    </div>`;
  }).join('');

  openSheet(`
    <div class="sheet-head"><h3>Price order — ${shopName}</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <p style="color:var(--ink-soft);font-size:12.5px;margin:-6px 0 14px;">Requested ${new Date(o.order_date).toDateString()}. Fill in your cost and selling price for each item.</p>
    <div id="pricing-rows">${rowsHtml}</div>
    <div class="order-total"><span>Order total</span><span class="num" id="pricing-total">SAR 0</span></div>
    <p class="profit-note" id="pricing-profit-note">Profit: SAR 0</p>
    <div style="margin-top:16px;"><button class="btn btn-primary" onclick="saveOrderPricing('${o.id}')">Save & mark ready</button></div>
  `);
  updatePricingTotal();
}
function updatePricingTotal(){
  const rows = document.querySelectorAll('#pricing-rows .item-row');
  let total=0, cost=0;
  rows.forEach(r=>{
    const qty = parseFloat(r.querySelector('.p-qty').value)||0;
    const price = parseFloat(r.querySelector('.p-price').value)||0;
    const c = parseFloat(r.querySelector('.p-cost').value)||0;
    total += qty*price; cost += qty*c;
  });
  document.getElementById('pricing-total').textContent = fmt(total);
  document.getElementById('pricing-profit-note').textContent = 'Profit: ' + fmt(total-cost);
}
async function saveOrderPricing(orderId){
  const rows = document.querySelectorAll('#pricing-rows .item-row');
  let total=0, cost=0;
  const updates = [];
  rows.forEach(r=>{
    const itemId = r.dataset.itemId;
    const qty = parseFloat(r.querySelector('.p-qty').value)||0;
    const c = parseFloat(r.querySelector('.p-cost').value)||0;
    const price = parseFloat(r.querySelector('.p-price').value)||0;
    total += qty*price; cost += qty*c;
    updates.push(sb.from('bt_order_items').update({quantity:qty, unit_cost:c, unit_price:price}).eq('id', itemId));
  });
  const results = await Promise.all(updates);
  const failed = results.find(r=>r.error);
  if(failed){ toast(failed.error.message, true); return; }

  const {error} = await sb.from('bt_orders').update({
    total_amount: total, total_cost: cost, status: 'due'
  }).eq('id', orderId);
  if(error){ toast(error.message, true); return; }

  toast('Order priced — ready to deliver');
  closeSheet();
  await loadAll();
  printBill(orderId);
}

/* ---- Print bill ---- */

  const o = ORDERS.find(x=>x.id===orderId) || null;
  const render = (order)=>{
    const shopName = order.bt_shops?.name || SHOPS.find(s=>s.id===order.shop_id)?.name || 'Shop';
    const items = order.bt_order_items || [];
    const billNo = order.bill_number ? String(order.bill_number).padStart(4,'0') : '----';

      <tr>

        <td class="c">${Number(i.line_total).toFixed(2)}</td>

    const w = window.open('', '_blank');

        .head .ref{font-size:12px;color:#8B0000;font-weight:bold;margin-top:4px;}
        .head .center{text-align:center;flex:1;}
        .head .cart{font-size:42px;line-height:1;}
        .head .fatura-ar{font-size:19px;font-weight:bold;color:#1a3b8f;margin:4px 0 0;direction:rtl;}
        .head .fatura-en{font-size:15px;font-weight:bold;color:#1a3b8f;margin:2px 0 0;letter-spacing:1.5px;}
        .meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:18px;padding:0 2px;}
        .meta .ar{direction:rtl;}
        .table-wrap{border:3px double #1a3b8f;border-radius:14px;overflow:hidden;margin-top:6px;}

        td.desc{text-align:left;}
        td.c{text-align:center;}
        .total-row td{font-weight:bold;background:#f7f5f0;}
        .total-row td.desc{text-align:right;direction:rtl;}
        .foot{display:flex;justify-content:space-between;margin-top:22px;font-size:12px;}
        .foot .line{border-top:1px solid #000;width:150px;text-align:center;padding-top:4px;}
        @media print{ .noprint{display:none;} }
      </style></head>
      <body>
        <div class="sheet">
          <div class="head">
            <div class="en">
              <p class="brand">Supplies</p>
              <p class="sub">For foodstuffs</p>
              <p class="ref">Bill No: ${billNo} &nbsp;|&nbsp; ${dateStr}</p>
            </div>
            <div class="center">
              <div class="cart">🛒</div>
              <p class="fatura-ar">فاتورة</p>
              <p class="fatura-en">INVOICE</p>
            </div>
            <div class="ar">
              <p class="brand-ar">تموينات</p>
              <p class="sub">للمواد الغذائية</p>
            </div>
          </div>
          <div class="meta">
            <div>Customer: <strong>${shopName}</strong></div>
            <div class="ar">العميل: <strong>${shopName}</strong></div>
          </div>
          <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:42%;"><span class="en">Description</span><span class="ar">البيان</span></th>
                <th style="width:16%;"><span class="en">Qty</span><span class="ar">العدد</span></th>

                <th style="width:21%;"><span class="en">Total Price</span><span class="ar">السعر الإجمالي</span></th>
              </tr>

/* ============ PRODUCTS ============ */
function renderProducts(){
  const wrap = document.getElementById('products-list');
  if(PRODUCTS.length===0){
    wrap.innerHTML = emptyState('🧺','No products yet','Add products so orders auto-fill prices.');
    return;
  }
  wrap.innerHTML = PRODUCTS.map(p=>`
    <div class="product-row">
      <div>
        <p class="pname">${p.name}</p>
        <p class="pmeta">Cost ${fmt(p.cost_price)} · Sell ${fmt(p.sell_price)} / ${p.unit}</p>
      </div>
      <button class="pedit" onclick='openProductForm(${JSON.stringify(p)})'>Edit</button>
    </div>
  `).join('');
}
function openProductForm(existing){
  const p = existing || {};
  openSheet(`
    <div class="sheet-head"><h3>${existing?'Edit product':'Add product'}</h3><button class="close" onclick="closeSheet()">✕</button></div>
    <label>Product name</label>
    <input type="text" id="f-prod-name" value="${p.name||''}" placeholder="e.g. Rice 5kg">
    <label>Unit</label>
    <input type="text" id="f-prod-unit" value="${p.unit||'pcs'}" placeholder="pcs, kg, box...">
    <div class="grid3" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><label>Cost price (SAR)</label><input type="number" id="f-prod-cost" value="${p.cost_price||0}" step="0.01"></div>
      <div><label>Sell price (SAR)</label><input type="number" id="f-prod-price" value="${p.sell_price||0}" step="0.01"></div>
    </div>
    <div style="margin-top:18px;"><button class="btn btn-primary" onclick="saveProduct('${existing?existing.id:''}')">Save product</button></div>
  `);
}
async function saveProduct(id){
  const name = document.getElementById('f-prod-name').value.trim();
  if(!name){ toast('Product name is required', true); return; }
  const payload = {
    name,
    unit: document.getElementById('f-prod-unit').value.trim() || 'pcs',
    cost_price: parseFloat(document.getElementById('f-prod-cost').value)||0,
    sell_price: parseFloat(document.getElementById('f-prod-price').value)||0
  };
  const q = id ? sb.from('bt_products').update(payload).eq('id', id) : sb.from('bt_products').insert(payload);
  const {error} = await q;
  if(error){ toast(error.message, true); return; }
  toast('Product saved');
  closeSheet();
  await loadAll();
}

/* ============ REPORTS ============ */
function renderReports(){
  const now = new Date();
  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const monthOrders = ORDERS.filter(o=>(o.order_date||'').startsWith(ym));
  let profit = 0, total = 0;
  monthOrders.forEach(o=>{
    total += Number(o.total_amount||0);
    (o.bt_order_items||[]).forEach(it=> profit += Number(it.line_profit||0));
  });
  const totalDue = BALANCES.reduce((s,b)=> s + Number(b.balance_due||0), 0);
  const collected = total - monthOrders.reduce((s,o)=>{
    const bal = BALANCES.find(b=>b.shop_id===o.shop_id);
    return s;
  },0);

  document.getElementById('rep-orders').textContent = monthOrders.length;
  document.getElementById('rep-profit').textContent = fmt(profit);
  document.getElementById('rep-collected').textContent = fmt(total - totalDue > 0 ? total - totalDue : 0);
  document.getElementById('rep-outstanding').textContent = fmt(totalDue);

  const sorted = [...BALANCES].sort((a,b)=> Number(b.balance_due) - Number(a.balance_due)).filter(b=>b.balance_due>0);
  const wrap = document.getElementById('rep-shops');
  wrap.innerHTML = sorted.length ? sorted.map(b=>`
    <div class="row-card" onclick="viewShop('${b.shop_id}')">
      <div class="icon">${initials(b.shop_name)}</div>
      <div class="body"><p class="title">${b.shop_name}</p></div>
      <div class="right"><p class="amount" style="color:var(--red)">${fmt(b.balance_due)}</p></div>
    </div>
  `).join('') : emptyState('✅','All shops are clear','No outstanding dues right now.');
}

/* ============ INIT ============ */
loadAll();
</script>
</body>
</html>
